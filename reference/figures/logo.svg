<svg width="200" height="232" viewBox="0 0 200 232" xmlns="http://www.w3.org/2000/svg" role="img">
<title>directeffect hex sticker</title>
<desc>A perfect hexagon, Tron style. Six real computed drug positions (from fitting the package's own example statin network) form a landmass of varying height above a glowing water line. Three of the six (simvastatin, pravastatin, rosuvastatin) are the real placebo anchors and have dashed lines and ring buoys dropping to the water; the other three float purely from network connections. A small sailboat sits near the shore.</desc>
<defs>
<filter id="glowT" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="1.6" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="skyT" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#02030B"/>
<stop offset="100%" stop-color="#070E2A"/>
</linearGradient>
<linearGradient id="floorT" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#070E2A"/>
<stop offset="100%" stop-color="#01030C"/>
</linearGradient>
<clipPath id="hexClipT">
<path d="M100,26 L177.942286,71 L177.942286,161 L100,206 L22.057714,161 L22.057714,71 Z"/>
</clipPath>
</defs>

<path d="M105,24 L189.870530,73 L189.870530,171 L105,220 L20.129470,171 L20.129470,73 Z" fill="#04102E"/>
