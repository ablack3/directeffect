<path d="M27,164 q6,-2.5 12,0 q6,2.5 12,0" fill="none"/>
</g>
<g filter="url(#glowT)">
<path d="M33,163 L33,150" stroke="#EAF6FF" stroke-width="0.8" opacity="0.7" fill="none"/>
