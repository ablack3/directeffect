<circle cx="100" cy="65" r="55" fill="none" stroke="#FFD23F" stroke-width="1.2" opacity="0.3" filter="url(#glowT)"/>

<g fill="none" stroke="#FFD23F" stroke-width="0.7" opacity="0.25" filter="url(#glowT)">
<ellipse cx="95" cy="38" rx="15" ry="7.5"/>
<ellipse cx="95" cy="38" rx="23" ry="12"/>
</g>

<rect x="0" y="150" width="200" height="60" fill="url(#floorT)"/>
<g stroke="#FFD23F" stroke-width="0.8" opacity="0.55" filter="url(#glowT)">
<line x1="0" y1="150" x2="200" y2="150"/>
<line x1="-10" y1="160" x2="210" y2="160"/>
