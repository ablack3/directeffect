<text x="100" y="180" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="500" letter-spacing="1.6" fill="#FFD23F" opacity="0.85" filter="url(#glowT)">DIRECTEFFECT</text>
</g>

<path d="M100,26 L177.942286,71 L177.942286,161 L100,206 L22.057714,161 L22.057714,71 Z" fill="none" stroke="#04113A" stroke-width="2.5"/>
