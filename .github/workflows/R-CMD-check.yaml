# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
          error-on: '"warning"'

  coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Enforce the coverage floor
        run: |
          # src/*.cc and src/*.h are stanc-generated from inst/stan/*.stan by
          # rstantools at install time -- not hand-written, and their unused
          # Stan-generated branches (alternate log_prob/gradient paths our own
          # sampling calls never take) aren't ours to hold to this floor.
          generated <- c(
            "src/RcppExports.cpp",
            "src/stanExports_surface.cc", "src/stanExports_surface.h",
            "src/stanExports_anchored_surface.cc", "src/stanExports_anchored_surface.h"
          )
          cov <- covr::package_coverage(type = "tests", quiet = FALSE,
                                        line_exclusions = as.list(generated))
          print(cov)
          pct <- covr::percent_coverage(cov)
          cat(sprintf("Total coverage: %.2f%%\n", pct))
          if (pct < 90) {
            stop("Package coverage ", round(pct, 2),
                 "% fell below the 90% floor.")
          }
        shell: Rscript {0}
